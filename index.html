</head>
<body>

  <div class="container">
    <header>
      <div>
        <div class="header-brand">
          <img src="SpiffoDO.png" alt="Spiffo" class="spiffo-icon">
          <h1>Spiffo's Skill Tracker</h1>
        </div>
        <div class="subtitle">Click boxes to toggle: Blank ➔ Read/Owned (✓)</div>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-save" id="btn-save">💾 Save as TXT</button>
        <button type="button" class="btn btn-load" id="btn-load">📂 Load TXT</button>
        <button type="button" class="btn btn-compare" id="btn-compare">🤝 Compare File</button>
        <button type="button" class="btn btn-reset" id="btn-reset">🔄 Reset All</button>
      </div>
    </header>

    <input type="file" id="load-file-input" accept=".txt" class="visually-hidden">
    <input type="file" id="compare-file-input" accept=".txt" class="visually-hidden">

    <div id="legend-bar" class="legend-bar" hidden>
      <span class="legend-title">Compare Mode Active</span>
      <span class="legend-item"><span class="legend-box friend-check-demo"></span> Friend Has/Read (✓)</span>
      <span class="legend-item"><span class="legend-box friend-cross-demo"></span> Friend Needs (Blank)</span>
    </div>

    <main id="skills-grid" class="grid"></main>
  </div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'pz_skills_state';
      const BOX_COUNT = 5;

      const SKILL_DATA = Object.freeze({
        "Combat - Firearms": ["Aiming", "Reloading"],
        "Combat - Melee": ["Axe", "Long Blade", "Long Blunt", "Maintenance", "Short Blade", "Short Blunt", "Spear"],
        "Crafting": ["Blacksmithing", "Carpentry", "Carving", "Cooking", "Electrical", "Glassmaking", "Knapping", "Masonry", "Mechanics", "Pottery", "Tailoring", "Welding"],
        "Farming": ["Agriculture", "Animal Care", "Butchering"],
        "Physical": ["Fitness", "Lightfooted", "Nimble", "Running", "Sneaking", "Strength"],
        "Survival": ["First Aid", "Fishing", "Foraging", "Tracking", "Trapping"]
      });

      const NO_BOOK_MELEE = new Set(["Axe", "Long Blade", "Short Blade", "Short Blunt", "Spear"]);

      const elements = {
        grid: document.getElementById('skills-grid'),
        btnSave: document.getElementById('btn-save'),
        btnLoad: document.getElementById('btn-load'),
        btnCompare: document.getElementById('btn-compare'),
        btnReset: document.getElementById('btn-reset'),
        loadFile: document.getElementById('load-file-input'),
        compareFile: document.getElementById('compare-file-input'),
        legendBar: document.getElementById('legend-bar')
      };

      let state = loadInitialState();
      let friendState = null;

      function loadInitialState() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          return stored ? JSON.parse(stored) : {};
        } catch (e) {
          console.error('Failed to parse localStorage state:', e);
          return {};
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          console.error('Failed to save state to localStorage:', e);
        }
      }

      function parseTxtFile(text) {
        const parsed = {};
        const lines = text.split(/\r?\n/);
        let currentCategory = '';

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed || trimmed.startsWith('===') || trimmed.startsWith('SPIFFO')) continue;

          if (trimmed.endsWith(':') && !line.startsWith('\t')) {
            currentCategory = trimmed.slice(0, -1).trim();
          } else if (line.includes(':')) {
            const parts = line.split(':');
            const skillName = parts[0].trim();
            const boxesPart = parts[1];

            const brackets = boxesPart.match(/\[(.*?)\]/g);
            if (brackets && brackets.length === BOX_COUNT && currentCategory) {
              brackets.forEach((b, i) => {
                parsed[`${currentCategory}_${skillName}_${i}`] = b.includes('✓') ? 1 : 0;
              });
            }
          }
        }

        return parsed;
      }

      function updateBoxUI(el, userVal, friendVal, isNoBookSkill) {
        el.className = 'box';

        if (isNoBookSkill) {
          el.textContent = '';
          return;
        }

        if (userVal === 1) {
          el.classList.add('state-check');
          el.textContent = '✓';
        } else {
          el.textContent = '';
        }

        if (friendState !== null) {
          el.classList.add(friendVal === 1 ? 'friend-check' : 'friend-cross');
        }
      }

      function render() {
        const fragment = document.createDocumentFragment();

        for (const [category, skills] of Object.entries(SKILL_DATA)) {
          const card = document.createElement('div');
          card.className = 'category-card';

          const title = document.createElement('h2');
          title.className = 'category-title';
          title.textContent = category;
          card.appendChild(title);

          skills.forEach(skill => {
            const row = document.createElement('div');
            row.className = 'skill-row';

            const isNoBookSkill = category === 'Combat - Melee' && NO_BOOK_MELEE.has(skill);
            if (isNoBookSkill) {
              row.classList.add('no-book-row');
            }

            const name = document.createElement('span');
            name.className = 'skill-name';
            name.textContent = skill;
            row.appendChild(name);

            const boxesContainer = document.createElement('div');
            boxesContainer.className = 'boxes-container';

            for (let i = 0; i < BOX_COUNT; i++) {
              const key = `${category}_${skill}_${i}`;
              const boxState = state[key] || 0;
              const friendBoxState = friendState ? (friendState[key] || 0) : 0;

              const box = document.createElement('div');
              box.dataset.key = key;
              box.dataset.noBook = isNoBookSkill ? 'true' : 'false';

              updateBoxUI(box, boxState, friendBoxState, isNoBookSkill);
              boxesContainer.appendChild(box);
            }

            row.appendChild(boxesContainer);
            card.appendChild(row);
          });

          fragment.appendChild(card);
        }

        elements.grid.replaceChildren(fragment);
      }

      function exportToTxt() {
        let output = "SPIFFO'S SKILL BOOK CHECKLIST\n";
        output += "=============================\n\n";

        for (const [category, skills] of Object.entries(SKILL_DATA)) {
          output += `${category}:\n`;
          skills.forEach(skill => {
            const isNoBookSkill = category === "Combat - Melee" && NO_BOOK_MELEE.has(skill);
            let boxString = "";

            for (let i = 0; i < BOX_COUNT; i++) {
              const val = state[`${category}_${skill}_${i}`] || 0;
              boxString += (!isNoBookSkill && val === 1) ? "[✓] " : "[ ] ";
            }
            const paddedSkill = (skill + ":").padEnd(16, " ");
            output += `\t${paddedSkill} ${boxString.trim()}\n`;
          });
          output += "\n";
        }

        const blob = new Blob([output], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'pz_skills.txt';
        a.click();
        URL.revokeObjectURL(url);
      }

      function handleFileRead(file, callback) {
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          const parsed = parseTxtFile(e.target.result);
          if (parsed && Object.keys(parsed).length > 0) {
            callback(parsed);
          } else {
            alert("Could not parse file. Please upload a valid exported skill checklist TXT file.");
          }
        };
        reader.readAsText(file);
      }

      function setupEventListeners() {
        elements.grid.addEventListener('click', (e) => {
          const box = e.target.closest('.box');
          if (!box || box.dataset.noBook === 'true') return;

          const key = box.dataset.key;
          const nextState = state[key] === 1 ? 0 : 1;
          state[key] = nextState;
          
          saveState();

          const friendVal = friendState ? (friendState[key] || 0) : 0;
          updateBoxUI(box, nextState, friendVal, false);
        });

        elements.btnSave.addEventListener('click', exportToTxt);
        elements.btnLoad.addEventListener('click', () => elements.loadFile.click());

        elements.loadFile.addEventListener('change', (e) => {
          const file = e.target.files[0];
          handleFileRead(file, (parsed) => {
            if (confirm("Overwrite your current checklist with the loaded file?")) {
              state = parsed;
              saveState();
              render();
            }
          });
          e.target.value = '';
        });

        elements.btnCompare.addEventListener('click', () => {
          if (friendState) {
            friendState = null;
            elements.btnCompare.textContent = '🤝 Compare File';
            elements.btnCompare.classList.remove('active');
            elements.legendBar.hidden = true;
            render();
          } else {
            elements.compareFile.click();
          }
        });

        elements.compareFile.addEventListener('change', (e) => {
          const file = e.target.files[0];
          handleFileRead(file, (parsed) => {
            friendState = parsed;
            elements.btnCompare.textContent = '❌ Clear Compare';
            elements.btnCompare.classList.add('active');
            elements.legendBar.hidden = false;
            render();
          });
          e.target.value = '';
        });

        elements.btnReset.addEventListener('click', () => {
          if (confirm("Clear all checked skill boxes?")) {
            state = {};
            localStorage.removeItem(STORAGE_KEY);
            render();
          }
        });
      }

      function init() {
        setupEventListeners();
        render();
      }

      init();
    })();
  </script>
</body>
</html>
